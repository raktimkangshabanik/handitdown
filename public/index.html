<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hand It Down | College Book & Semester Gear Exchange</title>
  
  <!-- Fonts: Space Grotesk (Editorial) & Plus Jakarta Sans (Modern UI) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            stone: {
              50: '#FAF8F5',
              100: '#F4F1EA',
              200: '#E8E5DF',
              300: '#D5D1C7',
              400: '#B6B1A5',
              500: '#8E8B85',
              600: '#5E5D59',
              700: '#3D3C39',
              800: '#262524',
              900: '#141416',
            },
            accent: {
              DEFAULT: '#FF5A1F',
              hover: '#E4480E',
              light: '#FFF0E8',
              border: '#FFD4C2',
            },
            ink: '#141416',
          },
          fontFamily: {
            editorial: ['"Space Grotesk"', 'sans-serif'],
            body: ['"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Custom Core Design System Stylesheet -->
  <link rel="stylesheet" href="/styles.css">

  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel Standalone for JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23FF5A1F' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><path d='M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z'/><path d='M6 6h10'/><path d='M6 10h10'/><path d='M12 14v4'/><path d='m9 16 3 3 3-3'/></svg>">
</head>
<body class="bg-[#FAF8F5] text-[#141416] antialiased selection:bg-[#FFE3D6] selection:text-[#FF5A1F]">

  <!-- React Root -->
  <div id="root">
    <!-- Initial Loading State -->
    <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Plus Jakarta Sans', sans-serif;">
      <div style="width: 44px; height: 44px; border: 3px solid #E8E5DF; border-top-color: #FF5A1F; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
      <p style="margin-top: 16px; font-weight: 600; color: #5E5D59;">Loading Hand It Down...</p>
    </div>
  </div>

  <style>
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <!-- React Application Script -->
  <script type="text/babel" src="/app.jsx"></script>
</body>
</html>
